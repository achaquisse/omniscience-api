openapi: 3.0.3
info:
  title: Omniscience API
  description: REST API for managing educational data including courses, classes, students, and attendance records
  version: 1.0.0
  contact:
    name: Omniscience API Team

servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from Supabase authentication

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    Course:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Name:
          type: string
      required:
        - ID
        - Name

    Period:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Start:
          type: string
          format: date-time
        End:
          type: string
          format: date-time
      required:
        - ID
        - Start
        - End

    StudentClass:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Name:
          type: string
        CourseID:
          type: integer
          format: uint
        Course:
          $ref: '#/components/schemas/Course'
        PeriodId:
          type: integer
          format: uint
        Period:
          $ref: '#/components/schemas/Period'
      required:
        - ID
        - Name
        - CourseID
        - PeriodId

    Student:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        FirstName:
          type: string
        LastName:
          type: string
      required:
        - ID
        - FirstName
        - LastName

    Registration:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Status:
          type: string
        StudentID:
          type: integer
          format: uint
        Student:
          $ref: '#/components/schemas/Student'
      required:
        - ID
        - Status
        - StudentID

    AttendanceRequest:
      type: object
      properties:
        registration_id:
          type: integer
          format: uint
        date:
          type: string
          format: date
          example: "2024-01-15"
        status:
          type: string
          enum: [PRESENT, ABSENT, LATE, EXCUSED]
        remarks:
          type: string
      required:
        - registration_id
        - date
        - status

    AttendanceResponse:
      type: object
      properties:
        message:
          type: string
        registration_id:
          type: integer
          format: uint
        date:
          type: string
          format: date
        status:
          type: string
        remarks:
          type: string

    BulkAttendanceResponse:
      type: object
      properties:
        message:
          type: string
        records_processed:
          type: integer

    AttendanceReport:
      type: object
      properties:
        totalDays:
          type: integer
        presentCount:
          type: integer
        absentCount:
          type: integer
        lateCount:
          type: integer
        excusedCount:
          type: integer
        percentage:
          type: number
          format: float

    AttendanceRecord:
      type: object
      properties:
        date:
          type: string
          format: date
        status:
          type: string
        remarks:
          type: string

    WeeklyTrend:
      type: object
      properties:
        week:
          type: string
          example: "2024-W03"
        totalDays:
          type: integer
        presentCount:
          type: integer
        percentage:
          type: number
          format: float

    MonthlyTrend:
      type: object
      properties:
        month:
          type: string
          example: "2024-01"
        totalDays:
          type: integer
        presentCount:
          type: integer
        percentage:
          type: number
          format: float

    DetailedAttendanceReport:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/AttendanceReport'
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        weeklyTrends:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyTrend'
        monthlyTrends:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTrend'

    StudentClassAttendanceReport:
      type: object
      properties:
        studentClassId:
          type: integer
          format: uint
        studentClassName:
          type: string
        summary:
          $ref: '#/components/schemas/AttendanceReport'
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        weeklyTrends:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyTrend'
        monthlyTrends:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTrend'

    AggregatedStudentAttendanceReport:
      type: object
      properties:
        overallSummary:
          $ref: '#/components/schemas/AttendanceReport'
        byClass:
          type: array
          items:
            $ref: '#/components/schemas/StudentClassAttendanceReport'

    StudentAttendanceSummary:
      type: object
      properties:
        studentId:
          type: integer
          format: uint
        studentName:
          type: string
        totalDays:
          type: integer
        presentCount:
          type: integer
        absentCount:
          type: integer
        lateCount:
          type: integer
        excusedCount:
          type: integer
        percentage:
          type: number
          format: float

    DailyAttendance:
      type: object
      properties:
        date:
          type: string
          format: date
        totalStudents:
          type: integer
        presentCount:
          type: integer
        absentCount:
          type: integer
        lateCount:
          type: integer
        excusedCount:
          type: integer
        percentage:
          type: number
          format: float

    ClassAttendanceReport:
      type: object
      properties:
        period:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalStudents:
          type: integer
        overallSummary:
          $ref: '#/components/schemas/AttendanceReport'
        studentSummaries:
          type: array
          items:
            $ref: '#/components/schemas/StudentAttendanceSummary'
        dailyData:
          type: array
          items:
            $ref: '#/components/schemas/DailyAttendance'
        weeklyData:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyTrend'
        monthlyData:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTrend'

    EvaluationCategory:
      type: object
      properties:
        id:
          type: integer
          format: uint
        course_id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        max_score:
          type: number
          format: float
          description: Maximum score for items in this category
        cardinality:
          type: integer
          description: Number of evaluations expected for this category
          default: 1
        display_order:
          type: integer
          description: Order in which to display this category
        is_active:
          type: boolean
          description: Whether this category is currently active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - course_id
        - name

    EvaluationCategoryRequest:
      type: object
      properties:
        course_id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        max_score:
          type: number
          format: float
        display_order:
          type: integer
      required:
        - course_id
        - name

    GradingFormula:
      type: object
      properties:
        id:
          type: integer
          format: uint
        course_id:
          type: integer
          format: uint
        formula_type:
          type: string
          enum: [WEIGHTED_AVERAGE, POINTS_BASED, PASS_FAIL, CUSTOM]
          description: Type of grading formula
        passing_percentage:
          type: number
          format: float
          description: Minimum percentage required to pass
        formula_config:
          type: object
          description: |
            Configuration for custom formulas. Supports multi-stage calculations and level-based formulas.
            
            Example - Informática (multi_stage):
            {
              "type": "multi_stage",
              "stages": {
                "MDF": {
                  "type": "weighted_average",
                  "categories": {
                    "Windows": 0.25,
                    "Excel": 0.25,
                    "Word": 0.25,
                    "PowerPoint": 0.25
                  }
                },
                "MF": {
                  "type": "simple_average",
                  "components": ["MDF", "Exame"]
                }
              }
            }
            
            Example - Inglês (multi_stage_level_based):
            {
              "type": "multi_stage_level_based",
              "levels": {
                "1": {
                  "stages": {
                    "MDF": {
                      "type": "weighted_average",
                      "categories": {
                        "Avaliação escrita": {"weight": 0.60, "count": 4},
                        "Ditados": {"weight": 0.20, "count": 8},
                        "Composições": {"weight": 0.10, "count": 2},
                        "Karaoke": {"weight": 0.10, "count": 2}
                      }
                    },
                    "MF": {
                      "type": "simple_average",
                      "components": ["MDF", "Exame"]
                    }
                  }
                },
                "2": { ... },
                "3": { ... },
                "4": { ... }
              }
            }
        is_active:
          type: boolean
          description: Whether this formula is currently active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - course_id
        - formula_type

    GradingFormulaRequest:
      type: object
      properties:
        course_id:
          type: integer
          format: uint
        formula_type:
          type: string
          enum: [WEIGHTED_AVERAGE, POINTS_BASED, PASS_FAIL, CUSTOM]
        passing_percentage:
          type: number
          format: float
        formula_config:
          type: object
          description: Configuration for CUSTOM formula type. See GradingFormula.formula_config for examples.
      required:
        - course_id
        - formula_type

    Grade:
      type: object
      properties:
        id:
          type: integer
          format: uint
        category_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        registration_id:
          type: integer
          format: uint
        name:
          type: string
          description: Name of the evaluation (e.g., "Quiz 1", "Midterm Exam")
        description:
          type: string
        date:
          type: string
          format: date
        due_date:
          type: string
          format: date-time
        max_score:
          type: number
          format: float
        score:
          type: number
          format: float
        percentage:
          type: number
          format: float
          description: Automatically calculated percentage score
        is_excused:
          type: boolean
        is_late:
          type: boolean
        late_penalty:
          type: number
          format: float
        comments:
          type: string
        graded_by:
          type: string
        graded_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        final_grade:
          $ref: '#/components/schemas/FinalGrade'
          description: Calculated final grade for this student (automatically calculated when grade is created/updated)
      required:
        - category_id
        - student_class_id
        - registration_id
        - name
        - max_score

    GradeRequest:
      type: object
      properties:
        category_id:
          type: integer
          format: uint
          description: ID of the evaluation category (provides name and max_score)
        registration_id:
          type: integer
          format: uint
          description: ID of the student registration (provides student_class_id)
        score:
          type: number
          format: float
          description: Score achieved by the student
        date:
          type: string
          format: date
          description: Evaluation date (YYYY-MM-DD)
        description:
          type: string
        due_date:
          type: string
          format: date-time
        is_excused:
          type: boolean
          default: false
        is_late:
          type: boolean
          default: false
        late_penalty:
          type: number
          format: float
        comments:
          type: string
        graded_by:
          type: string
      required:
        - category_id
        - registration_id

    UpdateGradeRequest:
      type: object
      properties:
        score:
          type: number
          format: float
          description: Updated score for the student. Must be >= 0 and <= category max_score.
        updated_by:
          type: string
          description: Identifier of the person updating the grade
      required:
        - score

    BatchGradeItem:
      type: object
      properties:
        registration_id:
          type: integer
          format: uint
        score:
          type: number
          format: float
        is_excused:
          type: boolean
        is_late:
          type: boolean
        comments:
          type: string
      required:
        - registration_id

    BatchGradeRequest:
      type: object
      properties:
        category_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        name:
          type: string
          description: Name of the evaluation (e.g., "Quiz 1", "Midterm Exam")
        description:
          type: string
        date:
          type: string
          format: date
        due_date:
          type: string
          format: date-time
        max_score:
          type: number
          format: float
        grades:
          type: array
          items:
            $ref: '#/components/schemas/BatchGradeItem'
      required:
        - category_id
        - student_class_id
        - name
        - max_score
        - grades

    BatchGradeResponse:
      type: object
      properties:
        message:
          type: string
        created:
          type: integer
        updated:
          type: integer
        grades:
          type: array
          items:
            $ref: '#/components/schemas/Grade'

    CategoryScore:
      type: object
      properties:
        category_id:
          type: integer
          format: uint
        category_name:
          type: string
        score:
          type: number
          format: float
        grades:
          type: array
          items:
            $ref: '#/components/schemas/Grade'

    StudentReport:
      type: object
      properties:
        registration_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        category_scores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CategoryScore'
        total_grades:
          type: integer
        final_grade:
          $ref: '#/components/schemas/FinalGrade'

    EvaluationStats:
      type: object
      properties:
        grade_id:
          type: integer
          format: uint
        evaluation_name:
          type: string
        category_id:
          type: integer
          format: uint
        category_name:
          type: string
        total_graded:
          type: integer
        average_percentage:
          type: number
          format: float
        min_percentage:
          type: number
          format: float
        max_percentage:
          type: number
          format: float
        passing_count:
          type: integer
        failing_count:
          type: integer

    ClassReport:
      type: object
      properties:
        student_class_id:
          type: integer
          format: uint
        class_name:
          type: string
        course_name:
          type: string
        evaluation_stats:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationStats'
        total_students:
          type: integer
        passing_students:
          type: integer
        average_final_grade:
          type: number
          format: float
        final_grades:
          type: array
          items:
            $ref: '#/components/schemas/FinalGrade'

    FinalGrade:
      type: object
      properties:
        id:
          type: integer
          format: uint
        registration_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        calculated_percentage:
          type: number
          format: float
        is_passing:
          type: boolean
        category_scores:
          type: object
          additionalProperties:
            type: object
            properties:
              category_id:
                type: integer
                format: uint
              score:
                type: number
                format: float
              weight:
                type: number
                format: float
        calculation_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StageComponentResult:
      type: object
      properties:
        name:
          type: string
        score:
          type: number
          format: float
        weight:
          type: number
          format: float

    StageResult:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        score:
          type: number
          format: float
        components:
          type: array
          items:
            $ref: '#/components/schemas/StageComponentResult'

    FormulaDetailedResult:
      type: object
      properties:
        final_score:
          type: number
          format: float
        is_passing:
          type: boolean
        passing_percentage:
          type: number
          format: float
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageResult'

    CategoryGradeStatistics:
      type: object
      properties:
        category_id:
          type: integer
          format: uint
          description: ID of the evaluation category
        category_name:
          type: string
          description: Name of the category
        cardinality:
          type: integer
          description: Number of evaluations expected for this category
        recorded_grades:
          type: integer
          description: Number of grades actually recorded (not excused)
        excused_grades:
          type: integer
          description: Number of excused grades
        missing_grades:
          type: integer
          description: Number of grades not yet recorded (cardinality - recorded_grades)
        average_score:
          type: number
          format: float
          description: Average score including zeros for missing grades
        includes_missing:
          type: boolean
          description: Whether there are missing grades affecting the average

    CalculateFinalGradesResponse:
      type: object
      properties:
        message:
          type: string
        student_class_id:
          type: integer
          format: uint

security:
  - bearerAuth: []

paths:
  /student-classes:
    get:
      summary: List student classes
      description: Returns a list of student classes for courses taught by the authenticated teacher
      operationId: listStudentClasses
      tags:
        - Student Classes
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Filter classes with period ending on or after this date
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: endDate
          in: query
          description: Filter classes with period starting on or before this date
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentClass'
        '400':
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /registrations:
    get:
      summary: List registrations
      description: Returns a list of student registrations for a specific class
      operationId: listRegistrations
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: studentClassId
          in: query
          description: ID of the student class
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registration'
        '400':
          description: Invalid studentClassId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token or user doesn't have permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance:
    post:
      summary: Record attendance
      description: Records or updates attendance for a single student registration
      operationId: recordAttendance
      tags:
        - Attendance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '201':
          description: Attendance recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance/bulk:
    post:
      summary: Record bulk attendance
      description: Records or updates attendance for multiple student registrations in a single transaction
      operationId: recordBulkAttendance
      tags:
        - Attendance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AttendanceRequest'
              minItems: 1
      responses:
        '201':
          description: Bulk attendance recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAttendanceResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error - All records have been rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance/report:
    get:
      summary: Get student attendance report
      description: |
        Returns attendance report for a specific student.
        - If student_class_id is provided: Returns detailed report for that specific class
        - If student_class_id is not provided: Returns aggregated report grouped by all student classes the student is enrolled in
      operationId: getStudentAttendanceReport
      tags:
        - Attendance
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          description: ID of the student
          required: true
          schema:
            type: integer
            format: uint32
        - name: student_class_id
          in: query
          description: Optional ID of the student class. If provided, returns report for only that class. If omitted, returns aggregated report by all classes.
          required: false
          schema:
            type: integer
            format: uint32
        - name: start_date
          in: query
          description: Start date of the report period (defaults to first day of current month)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: end_date
          in: query
          description: End date of the report period (defaults to current date)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-31"
      responses:
        '200':
          description: Successful response. Returns DetailedAttendanceReport if student_class_id is provided, or AggregatedStudentAttendanceReport if not provided.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DetailedAttendanceReport'
                  - $ref: '#/components/schemas/AggregatedStudentAttendanceReport'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance/class-report:
    get:
      summary: Get class attendance report
      description: Returns attendance report for an entire class with aggregated data
      operationId: getClassAttendanceReport
      tags:
        - Attendance
      security:
        - bearerAuth: []
      parameters:
        - name: student_class_id
          in: query
          description: ID of the student class
          required: true
          schema:
            type: integer
            format: uint32
        - name: start_date
          in: query
          description: Start date of the report period (defaults to first day of current month)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: end_date
          in: query
          description: End date of the report period (defaults to current date)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-31"
        - name: period
          in: query
          description: Aggregation period for attendance data
          required: false
          schema:
            type: string
            enum: [day, week, month, all]
            default: all
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassAttendanceReport'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grades/categories:
    get:
      summary: List evaluation categories
      description: Lists all evaluation categories for a course
      operationId: listEvaluationCategories
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: query
          description: ID of the course
          required: true
          schema:
            type: integer
            format: uint
        - name: include_inactive
          in: query
          description: Include inactive categories
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationCategory'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grades/formulas:
    get:
      summary: Get grading formula
      description: Get the active grading formula for a course
      operationId: getGradingFormula
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: query
          description: ID of the course
          required: true
          schema:
            type: integer
            format: uint
        - name: level_id
          in: query
          description: Optional level ID. If provided, returns formula for that level. If omitted, returns formula where level_id is NULL.
          required: false
          schema:
            type: integer
            format: uint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingFormula'
        '404':
          description: Grading formula not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grades/formulas/results:
    get:
      summary: Get formula calculation results
      description: Calculate and return detailed formula results for a student registration
      operationId: getFormulaResults
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      parameters:
        - name: registration_id
          in: query
          description: ID of the student registration
          required: true
          schema:
            type: integer
            format: uint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaDetailedResult'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grades:
    get:
      summary: List grades
      description: List grades with optional filters
      operationId: listGrades
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          description: Filter by evaluation category
          required: false
          schema:
            type: integer
            format: uint
        - name: registration_id
          in: query
          description: Filter by student registration
          required: false
          schema:
            type: integer
            format: uint
        - name: student_class_id
          in: query
          description: Filter by class
          required: false
          schema:
            type: integer
            format: uint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create grade
      description: |
        Create a single grade for a student.
        
        Validations:
        - category_id and registration_id are required
        - Category course must match student class course
        - Cannot exceed category cardinality limit
        - Score must be >= 0
        - Score must be <= category.max_score
        - Automatically calculates percentage
        - Automatically recalculates final grade
      operationId: createGrade
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeRequest'
      responses:
        '201':
          description: Grade created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          description: Invalid request body or validation error (course mismatch, cardinality limit, score range)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Registration or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grades/statistics:
    get:
      summary: Get grade statistics
      description: |
        Get statistics about recorded, excused, and missing grades for evaluation categories.
        
        Returns statistics showing:
        - How many grades have been recorded
        - How many grades are excused
        - How many grades are missing (based on cardinality)
        - Average score including zeros for missing grades
        
        Can fetch statistics for:
        - A single category (provide category_id)
        - All categories (omit category_id)
      operationId: getGradeStatistics
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          description: Filter by specific evaluation category (optional)
          required: false
          schema:
            type: integer
            format: uint
        - name: student_class_id
          in: query
          description: Student class ID (required)
          required: true
          schema:
            type: integer
            format: uint
        - name: registration_id
          in: query
          description: Student registration ID (required)
          required: true
          schema:
            type: integer
            format: uint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CategoryGradeStatistics'
                  - type: array
                    items:
                      $ref: '#/components/schemas/CategoryGradeStatistics'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grades/{id}:
    get:
      summary: Get grade
      description: Get a specific grade
      operationId: getGrade
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Grade ID
          required: true
          schema:
            type: integer
            format: uint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '404':
          description: Grade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update grade score
      description: |
        Partially update a grade (PATCH operation). Only updates the score field.
        
        Validations:
        - Score must be >= 0
        - Score must be <= category.max_score
        - Creates audit history record
        - Automatically recalculates percentage and final grade
      operationId: updateGrade
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Grade ID
          required: true
          schema:
            type: integer
            format: uint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGradeRequest'
      responses:
        '200':
          description: Grade updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Grade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grades/batch:
    post:
      summary: Batch create grades
      description: |
        Create multiple grades at once for an evaluation (e.g., grade all students for Quiz 1).
        
        Validations:
        - category_id and student_class_id are required
        - Category course must match student class course
        - Cannot exceed category cardinality limit (validates total: existing + new grades)
        - Automatically calculates percentage for each grade
        - Automatically recalculates final grades for affected students
      operationId: batchCreateGrades
      tags:
        - Grade Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGradeRequest'
      responses:
        '201':
          description: Grades created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGradeResponse'
        '400':
          description: Invalid request body or validation error (course mismatch, cardinality limit exceeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Student class or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /certificates:
    get:
      summary: Generate certificate
      description: Generate a PDF certificate for a student
      operationId: generateCertificate
      tags:
        - Certificates
      security:
        - bearerAuth: []
      parameters:
        - name: template
          in: query
          description: Certificate template language
          required: true
          schema:
            type: string
            enum: [portuguese, english]
        - name: studentName
          in: query
          description: Name of the student (minimum 5 characters)
          required: true
          schema:
            type: string
            minLength: 5
        - name: certDescription
          in: query
          description: Certificate description text (minimum 10 characters)
          required: true
          schema:
            type: string
            minLength: 10
      responses:
        '200':
          description: PDF certificate generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': 
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

tags:
  - name: Student Classes
    description: Operations related to student classes
  - name: Registrations
    description: Operations related to student registrations
  - name: Attendance
    description: Operations related to attendance tracking and reporting
  - name: Grade Management
    description: Operations related to grades, evaluation categories, and grading formulas
  - name: Certificates
    description: Operations related to certificate generation
