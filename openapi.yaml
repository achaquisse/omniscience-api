openapi: 3.0.3
info:
  title: Omniscience API
  description: REST API for managing educational data including courses, classes, students, and attendance records
  version: 1.0.0
  contact:
    name: Omniscience API Team

servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from Supabase authentication

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    Course:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Name:
          type: string
      required:
        - ID
        - Name

    Period:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Start:
          type: string
          format: date-time
        End:
          type: string
          format: date-time
      required:
        - ID
        - Start
        - End

    StudentClass:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Name:
          type: string
        CourseID:
          type: integer
          format: uint
        Course:
          $ref: '#/components/schemas/Course'
        PeriodId:
          type: integer
          format: uint
        Period:
          $ref: '#/components/schemas/Period'
      required:
        - ID
        - Name
        - CourseID
        - PeriodId

    Student:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        FirstName:
          type: string
        LastName:
          type: string
      required:
        - ID
        - FirstName
        - LastName

    Registration:
      type: object
      properties:
        ID:
          type: integer
          format: uint
        Status:
          type: string
        StudentID:
          type: integer
          format: uint
        Student:
          $ref: '#/components/schemas/Student'
      required:
        - ID
        - Status
        - StudentID

    AttendanceRequest:
      type: object
      properties:
        registration_id:
          type: integer
          format: uint
        date:
          type: string
          format: date
          example: "2024-01-15"
        status:
          type: string
          enum: [PRESENT, ABSENT, LATE, EXCUSED]
        remarks:
          type: string
      required:
        - registration_id
        - date
        - status

    AttendanceResponse:
      type: object
      properties:
        message:
          type: string
        registration_id:
          type: integer
          format: uint
        date:
          type: string
          format: date
        status:
          type: string
        remarks:
          type: string

    BulkAttendanceResponse:
      type: object
      properties:
        message:
          type: string
        records_processed:
          type: integer

    AttendanceReport:
      type: object
      properties:
        totalDays:
          type: integer
        presentCount:
          type: integer
        absentCount:
          type: integer
        lateCount:
          type: integer
        excusedCount:
          type: integer
        percentage:
          type: number
          format: float

    AttendanceRecord:
      type: object
      properties:
        date:
          type: string
          format: date
        status:
          type: string
        remarks:
          type: string

    WeeklyTrend:
      type: object
      properties:
        week:
          type: string
          example: "2024-W03"
        totalDays:
          type: integer
        presentCount:
          type: integer
        percentage:
          type: number
          format: float

    MonthlyTrend:
      type: object
      properties:
        month:
          type: string
          example: "2024-01"
        totalDays:
          type: integer
        presentCount:
          type: integer
        percentage:
          type: number
          format: float

    DetailedAttendanceReport:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/AttendanceReport'
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        weeklyTrends:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyTrend'
        monthlyTrends:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTrend'

    StudentClassAttendanceReport:
      type: object
      properties:
        studentClassId:
          type: integer
          format: uint
        studentClassName:
          type: string
        summary:
          $ref: '#/components/schemas/AttendanceReport'
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        weeklyTrends:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyTrend'
        monthlyTrends:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTrend'

    AggregatedStudentAttendanceReport:
      type: object
      properties:
        overallSummary:
          $ref: '#/components/schemas/AttendanceReport'
        byClass:
          type: array
          items:
            $ref: '#/components/schemas/StudentClassAttendanceReport'

    StudentAttendanceSummary:
      type: object
      properties:
        studentId:
          type: integer
          format: uint
        studentName:
          type: string
        totalDays:
          type: integer
        presentCount:
          type: integer
        absentCount:
          type: integer
        lateCount:
          type: integer
        excusedCount:
          type: integer
        percentage:
          type: number
          format: float

    DailyAttendance:
      type: object
      properties:
        date:
          type: string
          format: date
        totalStudents:
          type: integer
        presentCount:
          type: integer
        absentCount:
          type: integer
        lateCount:
          type: integer
        excusedCount:
          type: integer
        percentage:
          type: number
          format: float

    ClassAttendanceReport:
      type: object
      properties:
        period:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalStudents:
          type: integer
        overallSummary:
          $ref: '#/components/schemas/AttendanceReport'
        studentSummaries:
          type: array
          items:
            $ref: '#/components/schemas/StudentAttendanceSummary'
        dailyData:
          type: array
          items:
            $ref: '#/components/schemas/DailyAttendance'
        weeklyData:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyTrend'
        monthlyData:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTrend'

    EvaluationCategory:
      type: object
      properties:
        id:
          type: integer
          format: uint
        course_id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        weight:
          type: number
          format: float
          description: Weight of this category in final grade calculation (percentage)
        max_score:
          type: number
          format: float
          description: Maximum score for items in this category
        drop_lowest:
          type: integer
          description: Number of lowest scores to drop from this category
        is_extra_credit:
          type: boolean
          description: Whether this category is for extra credit
        display_order:
          type: integer
          description: Order in which to display this category
        is_active:
          type: boolean
          description: Whether this category is currently active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - course_id
        - name
        - weight

    EvaluationCategoryRequest:
      type: object
      properties:
        course_id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        weight:
          type: number
          format: float
        max_score:
          type: number
          format: float
        drop_lowest:
          type: integer
          default: 0
        is_extra_credit:
          type: boolean
          default: false
        display_order:
          type: integer
      required:
        - course_id
        - name
        - weight

    GradeScale:
      type: object
      additionalProperties:
        type: object
        properties:
          min:
            type: number
            format: float
          max:
            type: number
            format: float
      example:
        A: { min: 90, max: 100 }
        B: { min: 80, max: 89 }
        C: { min: 70, max: 79 }
        D: { min: 60, max: 69 }
        F: { min: 0, max: 59 }

    GradingFormula:
      type: object
      properties:
        id:
          type: integer
          format: uint
        course_id:
          type: integer
          format: uint
        formula_type:
          type: string
          enum: [WEIGHTED_AVERAGE, POINTS_BASED, PASS_FAIL, CUSTOM]
          description: Type of grading formula
        passing_percentage:
          type: number
          format: float
          description: Minimum percentage required to pass
        grading_scale:
          $ref: '#/components/schemas/GradeScale'
        formula_config:
          type: object
          description: Additional configuration for custom formulas
        is_active:
          type: boolean
          description: Whether this formula is currently active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - course_id
        - formula_type

    GradingFormulaRequest:
      type: object
      properties:
        course_id:
          type: integer
          format: uint
        formula_type:
          type: string
          enum: [WEIGHTED_AVERAGE, POINTS_BASED, PASS_FAIL, CUSTOM]
        passing_percentage:
          type: number
          format: float
        grading_scale:
          $ref: '#/components/schemas/GradeScale'
        formula_config:
          type: object
      required:
        - course_id
        - formula_type

    EvaluationItem:
      type: object
      properties:
        id:
          type: integer
          format: uint
        category_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        due_date:
          type: string
          format: date-time
        max_score:
          type: number
          format: float
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - category_id
        - student_class_id
        - name
        - max_score

    EvaluationItemRequest:
      type: object
      properties:
        category_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        due_date:
          type: string
          format: date-time
        max_score:
          type: number
          format: float
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          default: DRAFT
      required:
        - category_id
        - student_class_id
        - name
        - max_score

    Grade:
      type: object
      properties:
        id:
          type: integer
          format: uint
        evaluation_item_id:
          type: integer
          format: uint
        registration_id:
          type: integer
          format: uint
        score:
          type: number
          format: float
        percentage:
          type: number
          format: float
          description: Automatically calculated percentage score
        letter_grade:
          type: string
          description: Automatically assigned letter grade
        is_excused:
          type: boolean
        is_late:
          type: boolean
        late_penalty:
          type: number
          format: float
        comments:
          type: string
        graded_by:
          type: string
        graded_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - evaluation_item_id
        - registration_id

    GradeRequest:
      type: object
      properties:
        evaluation_item_id:
          type: integer
          format: uint
        registration_id:
          type: integer
          format: uint
        score:
          type: number
          format: float
        is_excused:
          type: boolean
          default: false
        is_late:
          type: boolean
          default: false
        late_penalty:
          type: number
          format: float
        comments:
          type: string
        graded_by:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
          default: DRAFT
      required:
        - evaluation_item_id
        - registration_id

    BatchGradeItem:
      type: object
      properties:
        registration_id:
          type: integer
          format: uint
        score:
          type: number
          format: float
        is_excused:
          type: boolean
        is_late:
          type: boolean
        comments:
          type: string
      required:
        - registration_id

    BatchGradeRequest:
      type: object
      properties:
        evaluation_item_id:
          type: integer
          format: uint
        grades:
          type: array
          items:
            $ref: '#/components/schemas/BatchGradeItem'
      required:
        - evaluation_item_id
        - grades

    BatchGradeResponse:
      type: object
      properties:
        message:
          type: string
        created:
          type: integer
        updated:
          type: integer
        grades:
          type: array
          items:
            $ref: '#/components/schemas/Grade'

    PublishGradesResponse:
      type: object
      properties:
        message:
          type: string
        published:
          type: integer

    CategoryScore:
      type: object
      properties:
        category_id:
          type: integer
          format: uint
        category_name:
          type: string
        weight:
          type: number
          format: float
        score:
          type: number
          format: float
        grades:
          type: array
          items:
            $ref: '#/components/schemas/Grade'

    StudentReport:
      type: object
      properties:
        registration_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        category_scores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CategoryScore'
        total_grades:
          type: integer
        final_grade:
          $ref: '#/components/schemas/FinalGrade'

    EvaluationStats:
      type: object
      properties:
        evaluation_item_id:
          type: integer
          format: uint
        evaluation_name:
          type: string
        category_name:
          type: string
        total_graded:
          type: integer
        average_percentage:
          type: number
          format: float
        min_percentage:
          type: number
          format: float
        max_percentage:
          type: number
          format: float
        passing_count:
          type: integer
        failing_count:
          type: integer

    ClassReport:
      type: object
      properties:
        student_class_id:
          type: integer
          format: uint
        class_name:
          type: string
        course_name:
          type: string
        evaluation_stats:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationStats'
        total_students:
          type: integer
        passing_students:
          type: integer
        average_final_grade:
          type: number
          format: float
        final_grades:
          type: array
          items:
            $ref: '#/components/schemas/FinalGrade'

    FinalGrade:
      type: object
      properties:
        id:
          type: integer
          format: uint
        registration_id:
          type: integer
          format: uint
        student_class_id:
          type: integer
          format: uint
        calculated_percentage:
          type: number
          format: float
        letter_grade:
          type: string
        is_passing:
          type: boolean
        category_scores:
          type: object
          additionalProperties:
            type: object
            properties:
              category_id:
                type: integer
                format: uint
              score:
                type: number
                format: float
              weight:
                type: number
                format: float
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        calculation_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CalculateFinalGradesResponse:
      type: object
      properties:
        message:
          type: string
        student_class_id:
          type: integer
          format: uint

security:
  - bearerAuth: []

paths:
  /student-classes:
    get:
      summary: List student classes
      description: Returns a list of student classes for courses taught by the authenticated teacher
      operationId: listStudentClasses
      tags:
        - Student Classes
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Filter classes with period ending on or after this date
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: endDate
          in: query
          description: Filter classes with period starting on or before this date
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentClass'
        '400':
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /registrations:
    get:
      summary: List registrations
      description: Returns a list of student registrations for a specific class
      operationId: listRegistrations
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: studentClassId
          in: query
          description: ID of the student class
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registration'
        '400':
          description: Invalid studentClassId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token or user doesn't have permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance:
    post:
      summary: Record attendance
      description: Records or updates attendance for a single student registration
      operationId: recordAttendance
      tags:
        - Attendance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '201':
          description: Attendance recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance/bulk:
    post:
      summary: Record bulk attendance
      description: Records or updates attendance for multiple student registrations in a single transaction
      operationId: recordBulkAttendance
      tags:
        - Attendance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AttendanceRequest'
              minItems: 1
      responses:
        '201':
          description: Bulk attendance recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAttendanceResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error - All records have been rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance/report:
    get:
      summary: Get student attendance report
      description: |
        Returns attendance report for a specific student.
        - If student_class_id is provided: Returns detailed report for that specific class
        - If student_class_id is not provided: Returns aggregated report grouped by all student classes the student is enrolled in
      operationId: getStudentAttendanceReport
      tags:
        - Attendance
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          description: ID of the student
          required: true
          schema:
            type: integer
            format: uint32
        - name: student_class_id
          in: query
          description: Optional ID of the student class. If provided, returns report for only that class. If omitted, returns aggregated report by all classes.
          required: false
          schema:
            type: integer
            format: uint32
        - name: start_date
          in: query
          description: Start date of the report period (defaults to first day of current month)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: end_date
          in: query
          description: End date of the report period (defaults to current date)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-31"
      responses:
        '200':
          description: Successful response. Returns DetailedAttendanceReport if student_class_id is provided, or AggregatedStudentAttendanceReport if not provided.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DetailedAttendanceReport'
                  - $ref: '#/components/schemas/AggregatedStudentAttendanceReport'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attendance/class-report:
    get:
      summary: Get class attendance report
      description: Returns attendance report for an entire class with aggregated data
      operationId: getClassAttendanceReport
      tags:
        - Attendance
      security:
        - bearerAuth: []
      parameters:
        - name: student_class_id
          in: query
          description: ID of the student class
          required: true
          schema:
            type: integer
            format: uint32
        - name: start_date
          in: query
          description: Start date of the report period (defaults to first day of current month)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: end_date
          in: query
          description: End date of the report period (defaults to current date)
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-31"
        - name: period
          in: query
          description: Aggregation period for attendance data
          required: false
          schema:
            type: string
            enum: [day, week, month, all]
            default: all
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassAttendanceReport'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /evaluation-categories:
    get:
      summary: List evaluation categories
      description: Lists all evaluation categories for a course
      operationId: listEvaluationCategories
      tags:
        - Evaluation Categories
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: query
          description: ID of the course
          required: true
          schema:
            type: integer
            format: uint
        - name: include_inactive
          in: query
          description: Include inactive categories
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationCategory'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
